<table data-fx="reveal">
  {{- with .THead }}
  <thead>
    {{- range . }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }}{{ if ne . "left" }} style="text-align: {{ . }}"{{ end }}{{ end }}>{{ .Text | safeHTML }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  {{- end }}
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }}{{ if ne . "left" }} style="text-align: {{ . }}"{{ end }}{{ end }}>{{ .Text | safeHTML }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
