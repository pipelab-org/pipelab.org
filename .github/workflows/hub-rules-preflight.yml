name: Hub Rules Preflight

on:
  workflow_dispatch:
    inputs:
      rules_pr:
        description: Pull request number in pipelab-org/pipelock-rules
        required: true
        type: string
      rules_base:
        description: Full Rules base commit SHA
        required: true
        type: string
      rules_head:
        description: Full Rules head commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the site main branch
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_REF: ${{ github.ref }}
        run: |
          if [[ "$SITE_REPOSITORY" != 'pipelab-org/pipelab.org' || "$SITE_REF" != 'refs/heads/main' ]]; then
            echo 'Run Hub Rules Preflight from pipelab-org/pipelab.org main.' >&2
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Check Rules submission and report eligibility
        env:
          RULES_PR: ${{ inputs.rules_pr }}
          RULES_BASE: ${{ inputs.rules_base }}
          RULES_HEAD: ${{ inputs.rules_head }}
          HUB_RULES_PUBLIC_API: "1"
        run: |
          node scripts/hub/admission-producer.mjs preflight
          report="$RUNNER_TEMP/hub-rules-preflight.json"
          status=0
          node scripts/hub/contribution-preflight.mjs --fetch-pr "$RULES_PR" "$RULES_BASE" "$RULES_HEAD" > "$report" || status=$?
          node scripts/hub/admission-producer.mjs preflight
          {
            printf '%s\n\n' '## Rules contribution eligibility'
            if [[ -s "$report" ]]; then
              printf '%s\n' '```json'
              cat "$report"
              printf '%s\n' '```'
            else
              printf '%s\n' 'No eligibility report was produced. See the step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
