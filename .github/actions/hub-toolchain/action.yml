name: Hub toolchain
description: Prepare the pinned native reader and release inputs
inputs:
  mode:
    description: Trusted Hub workflow mode
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        # Hub naming checks Unicode 17.0 and ICU 78.3.
        node-version: 24.21.0
    - shell: bash
      run: npm ci --ignore-scripts
    - id: pins
      name: Read the committed tool versions
      shell: bash
      run: |
        printf 'go=%s\n' "$(jq -er '.go_version | sub("^go"; "")' scripts/hub/engine.json)" >> "$GITHUB_OUTPUT"
        printf 'hugo=%s\n' "$(tr -d '\n' < .hugo-version)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.pins.outputs.go }}
        cache: false
    - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
      with:
        hugo-version: ${{ steps.pins.outputs.hugo }}
        extended: true
    - name: Prepare the pinned reader and released CLI
      env:
        GOTOOLCHAIN: local
      shell: bash
      run: |
        scratch="$RUNNER_TEMP/hub-build"
        mkdir -p "$scratch/modules" "$scratch/bin"
        engine_version="$(jq -er '.version' scripts/hub/engine.json)"
        engine_sha="$(jq -er '.source_commit' scripts/hub/engine.json)"
        tag="refs/tags/v$engine_version"
        engine="$scratch/engine.git"
        git init --bare --quiet --template= "$engine"
        git -C "$engine" fetch --no-tags --no-recurse-submodules --depth=1 \
          https://github.com/pipelab-org/pipelock "+$tag:$tag"
        test "$(git -C "$engine" rev-parse "$tag^{}")" = "$engine_sha"
        git -C "$engine" show "$engine_sha:go.mod" > "$scratch/modules/go.mod"
        git -C "$engine" show "$engine_sha:go.sum" > "$scratch/modules/go.sum"
        go -C "$scratch/modules" mod download
        node scripts/hub/build-harness.mjs "$engine" "$scratch" > "$scratch/engine.json"

        release="$(jq -er '.version' scripts/hub/retrieval-pin.json)"
        asset="$(jq -er '.asset' scripts/hub/retrieval-pin.json)"
        digest="$(jq -er '.archive_sha256' scripts/hub/retrieval-pin.json)"
        curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          "https://github.com/pipelab-org/pipelock/releases/download/v$release/$asset" \
          --output "$scratch/release.tar.gz"
        printf '%s  %s\n' "$digest" "$scratch/release.tar.gz" | sha256sum --check --status
        tar -xzf "$scratch/release.tar.gz" -C "$scratch/bin" pipelock
    - name: Bind the producer and acquire the pinned benchmark fixtures
      env:
        HUB_MODE: ${{ inputs.mode }}
      shell: bash
      run: |
        scratch="$RUNNER_TEMP/hub-build"
        jq -e '.identity' "$scratch/engine.json" > "$scratch/engine-identity.json"
        node scripts/hub/admission-producer.mjs "$HUB_MODE" "$scratch/engine-identity.json"

        fixtures="$scratch/fixtures.git"
        git init --bare --quiet --template= "$fixtures"
        jq -er '[.[].rules_commit] | unique[] | select(test("^[a-f0-9]{40}$"))' \
          scripts/hub/bench-workload/official-sources.json > "$scratch/fixture-commits"
        while IFS= read -r commit; do
          git -C "$fixtures" fetch --no-tags --no-recurse-submodules --depth=1 \
            https://github.com/pipelab-org/pipelock-rules "$commit"
          test "$(git -C "$fixtures" rev-parse FETCH_HEAD)" = "$commit"
        done < "$scratch/fixture-commits"
