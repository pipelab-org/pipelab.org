# Integrations Pipelock ships a guide or artifact for. Rendered by
# partials/works-with.html. Every href is a real site page, repo guide,
# chart, verifier, or repository. color is the official brand hex
# (black-branded marks render as off-white on the dark ground; two
# too-dark marks use their official lighter brand tone). brand names a
# partial under layouts/partials/brands/; rows without one render a
# neutral monogram, never an invented logo. x/ypct are orbit positions in
# percent of the orbit box.
#
# The vertical key is `ypct`, NOT `y`. Do not rename it back. YAML 1.1 treats a
# bare `y` key as the boolean true, so the Hugo pinned in .hugo-version (which
# CI and the production build use) resolves `.y` to nothing and emits an empty
# `--y:%`, collapsing every planet onto the sun. Newer local Hugo parses `y` as
# a plain string, so the preview looks correct while production is broken.
# px/py are the precomputed SVG thread endpoints; keep templates math-free
# because the pinned Hugo also rejects `mul` on YAML floats.
