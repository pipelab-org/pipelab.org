# Single source of truth for Pipelock install commands.
#
# Every surface that shows an install command renders it from this file: the
# product page terminal, the homepage hero, and the learn guides. Editing a
# command here changes it everywhere at once. Do not hand-write an install
# command into a page; scripts/site-audit.mjs fails the build if you do.
#
# ORDER MATTERS. The order of `methods` is the published order, and the first
# entry is what a reader meets first. The pinned source build leads; the Homebrew tap is macOS and Linux only and must stay last.
# scripts/install-contract.mjs (run by scripts/site-audit.mjs) enforces the
# exact commands, the source-build note, and that the source build precedes Homebrew.
#
# VERSION in a command is substituted with site.Params.pipelock_version at build
# time, so a release version bump does not need an edit here.
#
# The one surface this does NOT reach is static/llms-full.txt, which is served
# raw and never passes through Hugo. It hard-codes the release tag, so a version
# bump needs a matching edit there; the same audit fails until it matches.

methods:
  - id: go
    label: Source (Go)
    short_label: Source (Go)
    note: "Requires Go 1.26+, Git, and Make. Start in a directory without a pipelock subdirectory. Community build only; use a release binary for paid features."
    command: |-
      git clone --branch vVERSION --depth 1 https://github.com/pipelab-org/pipelock.git
      make -C pipelock install

  - id: docker
    label: Docker
    short_label: Docker
    local_binary: false
    command: docker pull ghcr.io/luckypipewrench/pipelock:VERSION

  - id: helm
    label: Helm (OCI)
    short_label: Helm (OCI)
    note: "Kubernetes deployment. The chart version follows the Pipelock release."
    local_binary: false
    command: helm install pipelock oci://ghcr.io/luckypipewrench/charts/pipelock --version VERSION

  - id: homebrew
    label: Homebrew (macOS / Linux)
    short_label: Homebrew (macOS)
    command: brew install luckyPipewrench/tap/pipelock
