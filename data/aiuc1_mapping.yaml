# Pipelock -> AIUC-1 2026-07-15 accountability-control mapping.
# Rendered on /agent-evidence/; the same mapping ships in the packet PDF.
# "Mapped" means Pipelock can supply the stated evidence for the traffic it
# mediates; it never means Pipelock alone satisfies the AIUC-1 requirement.
aiuc_version: "2026-07-15"
groups:
  - key: direct
    label: "Direct"
    lede: "Shipped Pipelock control with shipped evidence, inside the mediation boundary."
    rows:
      - id: "E015"
        name: "Log AI system activity"
        capability: "Signed action receipts carrying mediated decision, policy hash, transport, scanner layer, and correlation context."
        artifact: "Receipt chain; independent verifier output; Audit Packet v0 only where emitted."
        limit: "Direct for Pipelock decisions. Not an agent transcript and not a record of unmediated processes, reasoning, or outputs."
      - id: "E015.1"
        name: "Logging implementation"
        capability: "Flight recorder and structured events for mediated enforcement decisions."
        artifact: "Receipt and flight-recorder configuration; sample chain; verifier output."
        limit: "Direct, within the mediation boundary."
      - id: "E015.4"
        name: "Log integrity protection"
        capability: "Ed25519-signed receipts, hash-linked ordering, signed checkpoints, and offline Go, TypeScript, Rust, and Python verifiers; the browser wasm reuses the Go implementation."
        artifact: "Receipt chain and checkpoints; signer public key supplied from a documented source outside the packet; verifier output."
        limit: "Direct for integrity and ordering of supplied records. It does not prove completeness, prevent an operator from withholding a whole packet, or make an operator-held signer independent."
      - id: "D003"
        name: "Restrict unsafe tool calls"
        capability: "The MCP proxy performs pre-execution input scanning, tool scanning, tool policy, and chain detection when configured."
        artifact: "Per-call signed receipts; verifier output; Audit Packet v0 only where emitted."
        limit: "Direct for mediated MCP tools. It does not control tools an agent reaches outside Pipelock."
      - id: "D003.1"
        name: "Tool authorization and validation"
        capability: "MCP tool-policy allow, deny, and redirect rules plus MCP input scanning."
        artifact: "Policy configuration and hash plus tool-call receipts and verifier output."
        limit: "Direct when enabled. Policy must be scoped and reviewed by the deployer."
      - id: "D003.3"
        name: "Tool call log"
        capability: "MCP records mediated tool-call decisions, policy context, and receipt correlation."
        artifact: "MCP receipt chain; Audit Packet v0 only where emitted; verifier output."
        limit: "Direct for the mediated call log. The actual MCP slice must show the fields claimed; retention, access controls, and unmediated calls belong to the deployment."
      - id: "B006.2"
        name: "Agent security monitoring and alerting"
        capability: "Enforcement receipts and security-event and webhook output."
        artifact: "Receipt chain; event-export configuration; external monitoring evidence."
        limit: "Direct for logging mediated boundary violations; partial for alerting. The organization supplies alert routing and response."
      - id: "B002.1"
        name: "Adversarial input detection and alerting"
        capability: "Inbound and outbound prompt-injection scanning, MCP input and response scanning, and events on detections."
        artifact: "Detection configuration; block receipts; event-export configuration."
        limit: "Direct for configured, mediated content. No claim about inputs that never reach Pipelock."
  - key: conditional
    label: "Conditional"
    lede: "Depends on the deployment or configuration named in the row."
    rows:
      - id: "B006.1"
        name: "Agent service access restrictions"
        capability: "HTTP and MCP policy enforcement, MCP server and tool policy, and the optional contain egress boundary."
        artifact: "Policy configuration; deny receipts; contain verification output where deployed."
        limit: "Network non-bypass requires the managed containment or deployment boundary; proxy configuration alone does not stop direct egress."
      - id: "B006.3"
        name: "Execution-level safeguards"
        capability: "MCP tool-definition scanning and drift detection with pre-execution policy; Linux containment uses managed identities and nftables."
        artifact: "Policy configuration; tool-drift or policy-deny receipts; containment posture output."
        limit: "Kernel containment requires the supported Linux and nftables deployment and successful verification; it is not a universal runtime sandbox."
      - id: "B008.2"
        name: "Agentic-interface transport security"
        capability: "TLS proxy and interception deployment support."
        artifact: "Deployment TLS configuration and, where applicable, mediated receipt context."
        limit: "Pipelock cannot prove every model, MCP, or agent-to-agent connection is TLS-protected, and TLS interception itself needs a correctly managed CA deployment."
  - key: partial
    label: "Partial"
    lede: "Useful evidence, with the stated gap. Offer it as an input, never the whole answer."
    rows:
      - id: "E009"
        name: "Monitor third-party access"
        capability: "Inline HTTP, WebSocket, MCP, and agent-to-agent mediation; MCP session binding; policy and scanner decision context."
        artifact: "Signed action-receipt chain and offline verifier output; Audit Packet v0 only when a producer actually emits one."
        limit: "Mediated traffic only. It can evidence traffic observed at Pipelock's control point, not a complete inventory of third-party connections, user or authentication sessions, or data access. Plain CONNECT exposes hostname-level data unless TLS interception is enabled."
      - id: "E009.1"
        name: "Third-party access monitoring"
        capability: "The same mediation plus request and decision metadata and SIEM or webhook event emission."
        artifact: "Receipt chain, selected event-export configuration, and verifier output."
        limit: "Partial for mediated connections. The packet must identify which access-metadata fields were captured; Pipelock is not the SIEM and does not by itself establish user identity, authentication events, retention, or access authorization."
      - id: "E015.2"
        name: "AI agent logging implementation"
        capability: "MCP input, tool, policy, and chain scanning with receipt correlation."
        artifact: "MCP receipt slice; Audit Packet v0 only where emitted; verifier output."
        limit: "Tool-call evidence is available on mediated MCP paths, subject to the selected capture and redaction configuration; Pipelock does not supply agent provenance, all delegations, human approvals, reasoning traces, or a complete record of parameters and results."
      - id: "D003.2"
        name: "Rate limits for tools"
        capability: "Request rate limiting and data budgets on mediated paths."
        artifact: "Active configuration and receipts or events for enforcement."
        limit: "Pipelock limits mediated requests; it is not a complete per-tool transaction-cap system."
      - id: "D003.5"
        name: "Tool-call-log reviews"
        capability: "Queryable receipt and event evidence can be an input to a review."
        artifact: "A reviewer-produced periodic review record, linked to verified evidence."
        limit: "Pipelock does not conduct the periodic review or make permission-retirement decisions."
      - id: "B002.2"
        name: "Adversarial incident and response"
        capability: "Timestamped block evidence and event emission."
        artifact: "Receipt chain plus a real incident record owned by the organization."
        limit: "Pipelock does not create, assign, or resolve incident tickets."
      - id: "A008.1"
        name: "Secrets detection in user inputs"
        capability: "DLP scanning on traffic and content Pipelock receives."
        artifact: "DLP policy configuration; block receipt with redacted evidence; verifier output."
        limit: "It is not a product UI warning and cannot see prompts that bypass mediation."
      - id: "B008.3"
        name: "Agentic-interface data integrity"
        capability: "MCP input and tool scanning with optional mediation metadata."
        artifact: "The relevant configuration plus MCP receipts."
        limit: "This is evidence of mediated inspection, not a claim of universal MCP schema validation or cryptographic authentication of every agent-to-agent message."
  - key: none
    label: "Not covered"
    lede: "Do not offer Pipelock as evidence for these controls. Saying so is the point."
    rows:
      - id: "E009.2"
        name: "Anomalous third-party access alerting"
        limit: "Pipelock emits security events a SIEM can consume, but it does not itself provide anomaly rules, case assignment, triage notes, or resolution records."
      - id: "D003.4"
        name: "Human-approval workflows"
        limit: "Pipelock does not supply approval workflow, approver identity, or ticket evidence."
      - id: "B008.1"
        name: "API and agentic-interface authentication"
        limit: "Pipelock may observe auth-related metadata but does not provide organization-wide API, OIDC, or mutual-auth controls."
      - id: "B008.4"
        name: "Model hosting security"
        limit: "Pipelock does not secure model images, GPU isolation, or hosting infrastructure."
      - id: "B008.5"
        name: "Model integrity verification"
        limit: "Pipelock does not verify model artifacts before or during deployment."
      - id: "A008.5"
        name: "Secrets redaction in logs and stored artifacts"
        limit: "Optional redaction covers mediated request paths, and receipts record redaction context rather than plaintext values, but that cannot establish sanitation of conversation history, application logs, or every stored artifact."
      - id: "E015.3"
        name: "Log storage"
        limit: "Retention, WORM storage, access control, and deletion policy are deployment-owned."
