# Blog index editorial state.
# Drives the /blog/ index page (themes/pipelab/layouts/blog/list.html).
# Per-post categories live in each post's frontmatter as `blog_cat: <key>`.
# Counts come from real .Pages at build time, not from this file.

categories:
  - key: releases
    label: Releases
  - key: mcp
    label: MCP security
  - key: industry
    label: Industry
  - key: comparisons
    label: Comparisons
  - key: technical
    label: Technical
  - key: opsec
    label: OpSec

featured:
  - check-the-work
  - pipelock-v370-release
  - a-valid-receipt-chain-can-still-be-cut-short
  - localhost-is-a-place-not-a-program
  - pipelock-v360-release
  - pipelock-v330-release

# Latest release block in the sidebar. The version and release-notes link come
# from params.pipelock_version in hugo.toml. Update summary and minor together
# when a new minor release ships; a mismatch fails the build.
release:
  minor: "3.7"
  summary: "Parallel signed receipt chains, filesystem grants, and verified local MCP services."

subscribe:
  - label: dev.to mirror
    url: https://dev.to/luckypipewrench
    external: true
  - label: GitHub
    url: https://github.com/pipelab-org/pipelock
    external: true
